<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}PhishGuard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/popup.css') }}">

</head>
<body>
<div class="bg-blobs">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
</div>

<!-- GLOBAL HEADER -->
<header class="navbar">
   <a href="
{% if current_user.is_authenticated %}
    {% if current_user.role == 'admin' %}
        {{ url_for('admin.admin_dashboard') }}
    {% else %}
        {{ url_for('user.dashboard') }}
    {% endif %}
{% else %}
    {{ url_for('home') }}
{% endif %}
" class="logo">
    Phish<span>Guard</span>
</a>

    <nav class="nav-links">

    {% if current_user.is_authenticated %}

        <a href="/user/dashboard"><i class="ri-dashboard-line icon"></i>Dashboard</a>
        <a href="/user/history"><i class="ri-history-line icon"></i>History</a>
        <a href="/auth/logout"><i class="ri-logout-box-line icon"></i>Logout</a>

    {% else %}

        <a href="/"><i class="ri-home-line icon"></i>Home</a>
        <a href="/auth"><i class="ri-login-box-line icon"></i>Login</a>
        <a href="/auth"><i class="ri-user-add-line icon"></i>Sign Up</a>

    {% endif %}

</nav>

</header>

<!-- PAGE CONTENT -->
<main class="page-content">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/popup.js') }}"></script>

{% block extra_css %}{% endblock %}
</body>
</html>
