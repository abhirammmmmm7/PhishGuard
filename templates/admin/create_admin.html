<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Create Admin</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}">
</head>

<body>

<div class="admin-container">

<!-- SIDEBAR -->

<div class="admin-sidebar">

<h2 class="admin-logo">PhishGuard</h2>

<a href="/admin/dashboard">Dashboard</a>
<a href="/admin/create-admin-page">Create Admin</a>
<a href="/admin/admins">View Admins</a>
<a href="/">Main Site</a>
<a href="/auth/logout">Logout</a>

</div>


<!-- MAIN CONTENT -->

<div class="admin-main">

<div class="admin-header">
<h1>Create New Admin</h1>
<p class="welcome">Super Admin Panel</p>
</div>



<div class="glass-table admin-create-card">

<form action="/admin/create-admin" method="POST">

<div class="input-group">
<input type="text" name="username" placeholder="Admin Username" required>
</div>

<div class="input-group">
<input type="email" name="email" placeholder="Admin Email" required>
</div>

<div class="input-group">
<input type="password" name="password" placeholder="Password" required>
</div>

<button class="create-admin-btn" type="submit">
Create Admin
</button>

</form>

</div>

</div>

</div>
<div id="toast" class="toast"></div>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</body>
</html>
