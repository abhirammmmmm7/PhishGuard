<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Admins | PhishGuard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}">
</head>

<body>

<div class="admin-container">

<div class="admin-sidebar">

<h2 class="admin-logo">PhishGuard</h2>

<a href="/admin/dashboard">Dashboard</a>
<a href="/admin/create-admin-page">Create Admin</a>
<a href="/admin/admins">View Admins</a>
<a href="/">Main Site</a>
<a href="/auth/logout">Logout</a>

</div>


<div class="admin-main">

<div class="admin-header">
<h1>Admins</h1>
<p class="welcome">Super Admin: <span>{{ admin_name }}</span></p>
</div>

<div class="glass-table">

<h2>Admin Accounts</h2>
<table>

<thead>
<tr>
<th>ID</th>
<th>Username</th>
<th>Email</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for admin in admins %}

<tr>

<td>{{ admin.id }}</td>
<td>{{ admin.username }}</td>
<td>{{ admin.email }}</td>

<td>
<span style="color:#60a5fa;font-weight:600">
{{ admin.role }}
</span>
</td>

<td>
<a class="delete-btn" href="/admin/delete-admin/{{ admin.id }}">
Delete
</a>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
